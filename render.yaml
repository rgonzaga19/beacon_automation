services:
  - type: web
    name: beabots-web
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: beabots-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: BEABOTS_UPLOAD_DIR
        value: /tmp/beabots_uploads

databases:
  - name: beabots-db
    plan: free
