services:
  - type: web
    name: beabots-automation
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements-web.txt
    startCommand: gunicorn --worker-class gthread --workers 1 --threads 20 --timeout 0 --bind 0.0.0.0:$PORT web_entry:app
    healthCheckPath: /api/health
    envVars:
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: BEABOTS_UPLOAD_DIR
        value: /tmp/beabots_uploads
