<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finalize Claims</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/theme.css">
  <style>
    body { min-height:100vh; }
    .page { display:flex; flex-direction:column; height:100vh; min-height:0; }
    .header { padding:20px 24px 16px; border-bottom:1px solid var(--border); }
    .header h1 { margin:0; color:var(--text-pri); font-size:16px; letter-spacing:.4px; text-transform:uppercase; }
    .header p { margin:5px 0 0; color:var(--text-sec); font-size:11px; }
    main { flex:1; min-height:0; overflow:auto; padding:20px 24px; }
    .lookup-card { padding:18px; background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius-lg); }
    .lookup-form { display:flex; align-items:end; gap:10px; }
    .field { flex:1; min-width:0; }
    .field label { display:block; margin-bottom:7px; color:var(--text-sec); font-size:11px; font-weight:700; }
    .field input { width:100%; height:38px; padding:0 12px; color:var(--text-pri); background:var(--bg-dark); border:1px solid var(--border); border-radius:var(--radius-md); font:inherit; outline:none; }
    .field input:focus { border-color:var(--accent); }
    button { min-height:38px; padding:0 16px; }
    .summary { display:flex; flex-wrap:wrap; gap:8px 20px; margin:18px 0 12px; color:var(--text-sec); font-size:11px; }
    .summary strong { color:var(--text-pri); }
    .status-legend { display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; margin:16px 0 2px; padding:11px 13px; border:1px solid var(--border); border-radius:var(--radius-md); color:var(--text-sec); font-size:10px; }
    .legend-title { color:var(--text-pri); font-weight:700; letter-spacing:.3px; }
    .legend-item, .transmittal-status { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
    .status-dot { width:9px; height:9px; flex:none; border-radius:50%; background:var(--status-color,#909398); }
    .status-draft { --status-color:#92979b; }
    .status-transmitting { --status-color:#a5f51f; }
    .status-transmitted { --status-color:#ff8c00; }
    .status-transmit-error { --status-color:#fa171b; }
    .status-complete { --status-color:#188a28; }
    .status-on-queue { --status-color:#08a1b6; }
    .transmittal-status { padding:4px 8px; color:var(--text-pri); border:1px solid color-mix(in srgb, var(--status-color,#909398) 45%, transparent); border-radius:999px; background:color-mix(in srgb, var(--status-color,#909398) 10%, transparent); }
    .table-wrap { overflow:auto; border:1px solid var(--border); border-radius:var(--radius-md); }
    table { width:100%; border-collapse:collapse; font-size:11px; text-align:left; }
    th { color:var(--text-sec); background:var(--bg-panel); font-weight:700; white-space:nowrap; }
    th,td { padding:11px 12px; border-bottom:1px solid var(--border); }
    td { color:var(--text-pri); }
    tbody tr:last-child td { border-bottom:0; }
    .message { padding:24px 12px; color:var(--text-sec); text-align:center; }
    .message.error { color:var(--error); }
    @media(max-width:560px) { .lookup-form { align-items:stretch; flex-direction:column; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="header"><h1>Finalize Claims</h1><p>Look up claims by Beacon transmittal number.</p></header>
    <main>
      <section class="lookup-card" aria-label="Transmittal claims lookup">
        <form id="lookupForm" class="lookup-form">
          <div class="field"><label for="transmittalInput">Transmittal Number</label><input id="transmittalInput" type="text" autocomplete="off" placeholder="Enter transmittal number" required></div>
          <button class="cyber-btn" id="lookupButton" type="submit">LOOK UP</button>
        </form>
        <div class="status-legend" aria-label="Transmittal status legend">
          <span class="legend-title">STATUS LEGEND</span>
          <span class="legend-item status-draft"><i class="status-dot"></i>DRAFT</span>
          <span class="legend-item status-transmitting"><i class="status-dot"></i>TRANSMITTING</span>
          <span class="legend-item status-transmitted"><i class="status-dot"></i>TRANSMITTED</span>
          <span class="legend-item status-transmit-error"><i class="status-dot"></i>TRANSMIT ERROR</span>
          <span class="legend-item status-complete"><i class="status-dot"></i>COMPLETE</span>
          <span class="legend-item status-on-queue"><i class="status-dot"></i>ON QUEUE</span>
        </div>
        <div class="summary" id="summary" hidden></div>
        <div class="table-wrap">
          <table aria-label="Claims in transmittal">
            <thead><tr><th>Claim Series</th><th>Patient</th><th>Member</th><th>Claim Status</th><th>Transmittal Status</th><th>Package</th><th>Final</th></tr></thead>
            <tbody id="claimsBody"><tr><td class="message" colspan="7">Enter a transmittal number to view its claims.</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <div id="modalRoot"></div>
  <script src="js/common.js"></script>
  <script src="js/finalize-claims.js"></script>
</body>
</html>
