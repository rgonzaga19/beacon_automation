<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Beabots - Beacon Automation</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/theme.css" />
<style>
  .dashboard-layout { flex:1; display:flex; min-height:0; }
  .sidebar-column { width:232px; flex:0 0 232px; display:flex; flex-direction:column; min-height:0; background:var(--bg-panel); border-right:1px solid var(--border); transition:width 180ms ease,flex-basis 180ms ease; }
  .sidebar-column.collapsed { width:68px; flex-basis:68px; }
  .sidebar-topbar { height:86px; flex:0 0 86px; display:flex; align-items:center; padding:12px 10px; overflow:hidden; }
  .content-column { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }
  .menu-toggle { width:44px; height:44px; flex:0 0 44px; display:flex; align-items:center; justify-content:center; padding:0 13px; color:var(--text-sec); background:transparent; border:1px solid transparent; border-radius:var(--radius-md); cursor:pointer; transition:color 140ms ease,background 140ms ease,border-color 140ms ease; }
  .menu-toggle:hover { color:var(--text-pri); background:var(--accent-soft); border-color:var(--border); }
  .menu-toggle .side-icon { width:20px; min-width:20px; height:20px; display:grid; place-items:center; color:var(--accent); font-size:17px; line-height:1; }
  .sidebar { flex:1; display:flex; flex-direction:column; min-height:0; padding:14px 10px; overflow:hidden; background:var(--bg-panel); }
  .sidebar-brand { width:100%; display:flex; align-items:flex-start; gap:8px; color:inherit; }
  .brand-home { flex:0 1 auto; min-width:0; padding:0; color:inherit; text-align:left; background:transparent; border:0; cursor:pointer; }
  .brand-home:focus-visible, .menu-toggle:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--radius-md); }
  .brand-row { display:flex; align-items:center; gap:9px; min-width:200px; }
  .sidebar-topbar .brand-row { min-width:0; }
  .brand-icon { width:28px; height:28px; flex:0 0 28px; display:grid; place-items:center; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--accent-soft); }
  .brand-icon img { width:20px; height:20px; object-fit:contain; display:block; }
  .brand-copy { min-width:0; line-height:1.25; opacity:1; transition:opacity 100ms ease; }
  .brand-name { display:block; color:var(--text-pri); font:800 14px var(--font-ui); letter-spacing:.7px; }
  .brand-meta { display:flex; align-items:center; gap:5px; margin-top:3px; white-space:nowrap; }
  .brand-meta .version { color:var(--text-sec); font-size:9.5px; letter-spacing:.2px; }
  .brand-meta .version.update-available { color:var(--warning); }
  .brand-meta .version.up-to-date { color:var(--success); }
  .brand-meta .version.offline { color:var(--error); }
  .sidebar-status { display:flex; align-items:center; gap:7px; margin:11px 2px 0; color:var(--text-sec); font-size:9px; font-weight:700; letter-spacing:.6px; white-space:nowrap; transition:margin 180ms ease; }
  .sidebar-topbar .sidebar-status { margin:4px 0 0; }
  .sidebar-column.collapsed .brand-copy, .sidebar-column.collapsed .status-label { opacity:0; pointer-events:none; }
  .sidebar-column.collapsed .sidebar-status { margin-left:15px; }
  .sidebar-column.collapsed .sidebar-brand { align-items:center; justify-content:center; }
  .sidebar-column.collapsed .brand-home { width:0; flex:0 0 0; opacity:0; pointer-events:none; }
  .sidebar-nav { display:flex; flex-direction:column; gap:7px; }
  .sidebar-bottom { margin-top:auto; padding-top:12px; }
  .side-link { width:100%; height:44px; display:flex; align-items:center; gap:12px; padding:0 13px; color:var(--text-sec); background:transparent; border:1px solid transparent; border-radius:var(--radius-md); font:700 11px var(--font-ui); letter-spacing:.25px; white-space:nowrap; cursor:pointer; transition:color 140ms ease,background 140ms ease,border-color 140ms ease; }
  .side-link:hover { color:var(--text-pri); background:var(--accent-soft); border-color:var(--border); }
  .side-link.active { color:var(--text-pri); background:var(--accent-soft-strong); border-color:var(--accent); }
  .side-link .side-icon { width:20px; min-width:20px; height:20px; display:grid; place-items:center; color:var(--accent); font-size:17px; }
  .side-link .side-label { opacity:1; transition:opacity 100ms ease; }
  .sidebar-column.collapsed .side-label { opacity:0; pointer-events:none; }
  .sidebar-bottom .side-link:hover { color:var(--error); }

  .body { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 24px; min-width:0; min-height:0; text-align:center; }
  .welcome-content { display:flex; flex-direction:column; align-items:center; gap:20px; }
  .welcome-icon { font-size:48px; color:var(--accent); }
  .welcome-text h2 { font-size:24px; color:var(--text-pri); margin:0; font-weight:800; letter-spacing:.5px; }
  .welcome-text p { font-size:13px; color:var(--text-sec); margin:8px 0 0; line-height:1.5; }
  .app-window.dashboard-entering { animation:dashboard-shell-in 620ms cubic-bezier(.2,.85,.25,1) both; }
  .app-window.dashboard-entering .titlebar { animation:dashboard-drop-in 520ms 80ms cubic-bezier(.2,.85,.25,1) both; }
  .app-window.dashboard-entering .sidebar-column { animation:dashboard-sidebar-in 650ms 150ms cubic-bezier(.16,1,.3,1) both; }
  .app-window.dashboard-entering .body { animation:dashboard-content-in 640ms 260ms cubic-bezier(.16,1,.3,1) both; }
  @keyframes dashboard-shell-in { from { opacity:0; transform:scale(.965); filter:saturate(1.45) brightness(1.2); } to { opacity:1; transform:scale(1); filter:none; } }
  @keyframes dashboard-drop-in { from { opacity:0; transform:translateY(-22px); } to { opacity:1; transform:translateY(0); } }
  @keyframes dashboard-sidebar-in { from { opacity:0; transform:translateX(-58px); } to { opacity:1; transform:translateX(0); } }
  @keyframes dashboard-content-in { from { opacity:0; transform:translateY(25px) scale(.975); } to { opacity:1; transform:translateY(0) scale(1); } }
  @media (prefers-reduced-motion:reduce) {
    .app-window.dashboard-entering,
    .app-window.dashboard-entering .titlebar,
    .app-window.dashboard-entering .sidebar-column,
    .app-window.dashboard-entering .body { animation-duration:160ms; animation-delay:0ms; }
  }
  @media (max-width:500px) {
    .sidebar-column { width:100%; flex-basis:100%; }
    .sidebar-column.collapsed { width:68px; flex-basis:68px; }
    .body { display:none; }
  }
</style>
</head>
<body>
  <div class="app-window no-glow" id="dashboardShell">
    <div class="titlebar">
      <span class="icon"><img src="../bot.ico" alt=""></span>
      <span class="title">BEABOTS - BEACON AUTOMATION</span>
      <span class="spacer"></span>
      <div class="titlebar-btn" id="btnMinimize">─</div>
      <div class="titlebar-btn" id="btnMaximize">▢</div>
      <div class="titlebar-btn close" id="btnClose">×</div>
    </div>
    <div class="dashboard-layout">
      <div class="sidebar-column" id="dashboardSidebar">
        <div class="sidebar-topbar">
          <div class="sidebar-brand">
            <button class="brand-home" id="btnDashboardHome" type="button" title="Dashboard Home" aria-label="Return to dashboard home">
              <div class="brand-row">
                <span class="brand-icon" aria-hidden="true"><img src="../bot.ico" alt=""></span>
                <div class="brand-copy">
                  <span class="brand-name">BEABOTS</span>
                  <div class="brand-meta"><span class="version" id="appVersion">v...</span><span class="version" id="updateStatus"></span></div>
                </div>
              </div>
              <div class="sidebar-status"><span class="status-dot" id="statusDot"></span><span class="status-label" id="statusLabel">READY</span></div>
            </button>
            <button class="menu-toggle" id="btnSidebarToggle" type="button" aria-label="Collapse sidebar" aria-controls="dashboardSidebar" aria-expanded="true"><span class="side-icon" aria-hidden="true">&lsaquo;</span></button>
          </div>
        </div>
        <aside class="sidebar" aria-label="Main navigation">
          <nav class="sidebar-nav">
            <button class="side-link" id="btnCf2" type="button" title="Claim Form 2"><span class="side-icon" aria-hidden="true">➜</span><span class="side-label">Claim Form 2</span></button>
            <button class="side-link" id="btnUploadSoa" type="button" title="Auto Upload SOA"><span class="side-icon" aria-hidden="true">⇧</span><span class="side-label">Auto Upload SOA</span></button>
            <button class="side-link" id="btnCf4" type="button" title="Claim Form 4"><span class="side-icon" aria-hidden="true">▤</span><span class="side-label">Claim Form 4</span></button>
            <button class="side-link" id="btnSettings" type="button" title="Settings"><span class="side-icon" aria-hidden="true">⚙</span><span class="side-label">Settings</span></button>
            <button class="side-link" id="btnAbout" type="button" title="About"><span class="side-icon" aria-hidden="true">ℹ</span><span class="side-label">About</span></button>
          </nav>
          <div class="sidebar-bottom"><button class="side-link" id="btnLogout" type="button" title="Log out"><span class="side-icon" aria-hidden="true">↪</span><span class="side-label">Log out</span></button></div>
        </aside>
      </div>
      <div class="content-column">
        <main class="body">
          <div class="welcome-content"><div class="welcome-icon">◆</div><div class="welcome-text"><h2>Welcome to Beabots</h2><p>Automate your Beacon PhilHealth E-Claims workflow</p></div></div>
        </main>
      </div>
    </div>
  </div>
  <div id="modalRoot"></div>
  <script src="../node_modules/socket.io-client/dist/socket.io.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
