<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Chat | Beabots</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/theme.css">
  <style>
    html,body { width:100%; height:100%; overflow:hidden; }
    body { position:relative; color:var(--text-pri); background:var(--bg-dark); }

    /* ---------- Ambient background (decorative, behind everything) ---------- */
    .chat-ambient { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
    .chat-ambient i { position:absolute; display:block; border-radius:50%; filter:blur(80px); opacity:.5; will-change:transform; }
    .chat-ambient i:nth-child(1) { width:520px; height:520px; left:-8%; top:-18%; background:radial-gradient(circle,color-mix(in srgb,var(--accent) 55%,transparent),transparent 68%); animation:amb-a 26s ease-in-out infinite alternate; }
    .chat-ambient i:nth-child(2) { width:480px; height:480px; right:-8%; bottom:-16%; background:radial-gradient(circle,rgba(56,120,214,.5),transparent 68%); animation:amb-b 30s ease-in-out infinite alternate; }
    .chat-ambient i:nth-child(3) { width:360px; height:360px; right:20%; top:-12%; background:radial-gradient(circle,rgba(124,92,230,.34),transparent 68%); animation:amb-c 34s ease-in-out infinite alternate; }
    .chat-ambient::after { content:""; position:absolute; inset:0; background-image:linear-gradient(color-mix(in srgb,var(--text-pri) 5%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--text-pri) 5%,transparent) 1px,transparent 1px); background-size:44px 44px; -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000,transparent 72%); mask-image:radial-gradient(ellipse at 50% 30%,#000,transparent 72%); animation:grid-pan 40s linear infinite; }
    html[data-theme="light"] .chat-ambient i { opacity:.3; }
    @keyframes amb-a { to { transform:translate3d(18vw,14vh,0) scale(1.15); } }
    @keyframes amb-b { to { transform:translate3d(-16vw,-12vh,0) scale(1.1); } }
    @keyframes amb-c { to { transform:translate3d(-14vw,18vh,0) scale(.9); } }
    @keyframes grid-pan { to { background-position:44px 44px,44px 44px; } }

    /* ---------- Page layout ---------- */
    .chat-page { position:relative; z-index:1; display:flex; width:min(100%,1000px); height:100%; min-height:0; flex-direction:column; margin:0 auto; padding:clamp(14px,2.6vw,28px); }
    .chat-heading { flex:none; display:flex; align-items:center; gap:16px; padding-bottom:16px; animation:rise .6s cubic-bezier(.2,.75,.25,1) both; }
    .heading-mark { position:relative; display:grid; place-items:center; width:50px; height:50px; flex:none; color:var(--accent); background:linear-gradient(145deg,var(--accent-soft-strong),color-mix(in srgb,var(--accent) 6%,var(--bg-panel))); border:1px solid color-mix(in srgb,var(--accent) 32%,var(--border)); border-radius:15px; box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 16%,transparent); animation:breathe 4.5s ease-in-out infinite; }
    .heading-mark svg { width:24px; height:24px; }
    .heading-mark::after { content:""; position:absolute; right:-3px; top:-3px; width:11px; height:11px; border-radius:50%; background:var(--success); border:2px solid var(--bg-dark); }
    .heading-text { min-width:0; flex:1; }
    .eyebrow { color:var(--accent); font-size:10px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase; }
    h1 { margin:3px 0 4px; font-size:clamp(23px,4vw,31px); font-weight:780; letter-spacing:-.9px; line-height:1.1; }
    .chat-heading p { margin:0; color:var(--text-sec); font-size:12px; line-height:1.5; }
    @media(max-width:620px) { .chat-heading p { display:none; } .heading-mark { width:42px; height:42px; border-radius:13px; } }

    /* ---------- Panel ---------- */
    .chat-panel { position:relative; display:flex; flex:1; min-width:0; min-height:0; flex-direction:column; overflow:hidden; background:color-mix(in srgb,var(--bg-panel) 86%,transparent); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow-md),0 0 0 1px color-mix(in srgb,var(--accent) 5%,transparent); animation:rise .7s .08s cubic-bezier(.2,.75,.25,1) both; }
    .chat-status { position:relative; flex:none; display:flex; align-items:center; gap:9px; padding:11px 16px; color:var(--text-sec); border-bottom:1px solid var(--border); font-size:11px; font-weight:600; }
    .chat-status::before { content:""; width:8px; height:8px; flex:none; border-radius:50%; background:var(--success); box-shadow:0 0 0 0 color-mix(in srgb,var(--success) 55%,transparent); animation:live-ping 2.2s ease-out infinite; }
    .chat-panel.has-error .chat-status::before { background:var(--error); animation:none; }
    @keyframes live-ping { 0% { box-shadow:0 0 0 0 color-mix(in srgb,var(--success) 55%,transparent); } 80%,100% { box-shadow:0 0 0 9px transparent; } }

    /* ---------- Messages ---------- */
    .chat-messages { position:relative; display:flex; flex:1; min-height:0; flex-direction:column; gap:14px; overflow-y:auto; padding:20px 18px; overscroll-behavior:contain; }
    .empty-state[hidden] { display:none; }
    .empty-state { display:flex; flex-direction:column; align-items:center; gap:10px; margin:auto; max-width:360px; color:var(--text-sec); font-size:12px; line-height:1.55; text-align:center; animation:rise .6s .2s cubic-bezier(.2,.75,.25,1) both; }
    .empty-orb { position:relative; display:grid; place-items:center; width:74px; height:74px; margin-bottom:6px; color:var(--accent); background:radial-gradient(circle at 35% 30%,var(--accent-soft-strong),var(--accent-soft)); border:1px solid color-mix(in srgb,var(--accent) 30%,var(--border)); border-radius:50%; animation:float 5s ease-in-out infinite; }
    .empty-orb svg { width:32px; height:32px; }
    .empty-orb::before, .empty-orb::after { content:""; position:absolute; inset:-1px; border:1px solid var(--accent); border-radius:50%; opacity:0; animation:ring 3.2s ease-out infinite; }
    .empty-orb::after { animation-delay:1.6s; }
    @keyframes ring { 0% { transform:scale(1); opacity:.5; } 100% { transform:scale(1.9); opacity:0; } }
    .empty-title { color:var(--text-pri); font-size:15px; font-weight:700; }
    .starter-row { display:flex; flex-wrap:wrap; justify-content:center; gap:7px; margin-top:8px; }
    .starter { padding:7px 12px; color:var(--text-pri); background:var(--bg-card); border:1px solid var(--border); border-radius:999px; font:600 11px var(--font-ui); cursor:pointer; transition:transform .16s ease,border-color .16s ease,background .16s ease; }
    .starter:hover { transform:translateY(-2px); border-color:var(--accent); background:var(--accent-soft); }

    .message { position:relative; align-self:flex-start; max-width:min(78%,620px); padding:10px 13px 11px; background:var(--bg-card); border:1px solid var(--border); border-radius:16px 16px 16px 4px; overflow-wrap:anywhere; box-shadow:var(--shadow-sm); transform-origin:0 100%; animation:msg-in .45s cubic-bezier(.2,.8,.25,1.1) both; animation-delay:calc(min(var(--i,0),12) * 28ms); transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease; }
    .message:hover { transform:translateY(-1px); box-shadow:var(--shadow-md); border-color:color-mix(in srgb,var(--accent) 28%,var(--border)); }
    .message,.message * { user-select:text; -webkit-user-select:text; }
    .message.own { align-self:flex-end; transform-origin:100% 100%; background:linear-gradient(140deg,color-mix(in srgb,var(--accent) 24%,var(--bg-card)),color-mix(in srgb,var(--accent) 11%,var(--bg-card))); border-color:color-mix(in srgb,var(--accent) 38%,var(--border)); border-radius:16px 16px 4px 16px; }
    .message.just-sent { animation:msg-in .45s cubic-bezier(.2,.8,.25,1.1) both,sent-glow 1.4s ease-out; }
    @keyframes msg-in { from { opacity:0; transform:translateY(14px) scale(.94); } to { opacity:1; transform:none; } }
    @keyframes sent-glow { 0% { box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent); } 100% { box-shadow:0 0 0 14px transparent; } }
    .message.grouped { margin-top:-9px; }
    .message.grouped:not(.own) { border-top-left-radius:6px; }
    .message.own.grouped { border-top-right-radius:6px; }
    .message.grouped .message-meta { display:none; }

    .message-meta { display:flex; align-items:center; gap:9px; margin-bottom:5px; }
    .message-avatar { width:28px; height:28px; flex:0 0 28px; object-fit:contain; background:var(--bg-panel); border:1.5px solid color-mix(in srgb,var(--accent) 35%,var(--border)); border-radius:50%; transition:transform .25s cubic-bezier(.3,1.5,.5,1); }
    .message:hover .message-avatar { transform:scale(1.14) rotate(-6deg); }
    .message-meta strong { color:var(--accent); font-size:11px; font-weight:750; }
    .message-meta time { margin-left:auto; padding-left:10px; color:var(--text-sec); font-size:9.5px; opacity:.8; }
    .message-body { color:var(--text-pri); font-size:12.5px; line-height:1.6; white-space:pre-wrap; cursor:text; }
    .message-image-link { position:relative; display:block; max-width:100%; margin-top:8px; overflow:hidden; border-radius:10px; cursor:zoom-in; }
    .message-body + .message-image-link { margin-top:9px; }
    .message-image { display:block; width:auto; max-width:min(100%,520px); max-height:350px; border:1px solid var(--border); border-radius:10px; object-fit:contain; transition:transform .35s ease,filter .35s ease; }
    .message-image-link:hover .message-image { transform:scale(1.025); filter:brightness(1.06); }

    /* ---------- Jump to latest ---------- */
    .jump-latest { position:absolute; z-index:5; right:18px; bottom:132px; display:flex; align-items:center; gap:7px; padding:8px 13px 8px 11px; color:var(--accent-ink); background:var(--accent); border:0; border-radius:999px; font:750 11px var(--font-ui); cursor:pointer; box-shadow:0 8px 22px var(--accent-soft-strong),var(--shadow-md); opacity:0; transform:translateY(12px) scale(.9); pointer-events:none; transition:opacity .2s ease,transform .2s cubic-bezier(.2,.8,.25,1.2); }
    html[data-theme="light"] .jump-latest { color:#fff; }
    .jump-latest.show { opacity:1; transform:none; pointer-events:auto; }
    .jump-latest svg { width:14px; height:14px; }
    .jump-latest .badge { display:none; min-width:18px; padding:1px 6px; color:var(--accent); background:var(--accent-ink); border-radius:999px; font-size:10px; text-align:center; }
    html[data-theme="light"] .jump-latest .badge { background:#fff; }
    .jump-latest.has-new .badge { display:inline-block; }

    /* ---------- Composer ---------- */
    #chatError { flex:none; min-height:0; padding:0 18px; color:var(--error); font-size:11px; }
    #chatError:not(:empty) { min-height:17px; padding-bottom:8px; animation:shake .35s ease; }
    @keyframes shake { 20%,60% { transform:translateX(-4px); } 40%,80% { transform:translateX(4px); } }
    .attachment-preview { display:flex; align-items:center; gap:11px; margin:0 14px; padding:9px 11px; color:var(--text-sec); background:var(--bg-card); border:1px solid var(--border); border-radius:14px 14px 0 0; border-bottom:0; font-size:11px; animation:rise .25s ease both; }
    .attachment-preview[hidden] { display:none; }
    .attachment-preview img { width:46px; height:46px; object-fit:cover; border:1px solid var(--border); border-radius:9px; }
    .attachment-preview span { min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-pri); font-weight:600; }
    .attachment-preview button { min-height:30px; padding:0 11px; color:var(--text-pri); background:var(--bg-panel); border:1px solid var(--border); border-radius:8px; font:700 10px var(--font-ui); cursor:pointer; transition:border-color .15s ease,color .15s ease; }
    .attachment-preview button:hover { color:var(--error); border-color:var(--error); }

    .composer { position:relative; display:flex; flex:none; align-items:flex-end; gap:8px; margin:0 14px 14px; padding:8px; background:var(--bg-card); border:1px solid var(--border); border-radius:18px; transition:border-color .18s ease,box-shadow .18s ease; }
    .attachment-preview:not([hidden]) + .composer { border-top-left-radius:0; border-top-right-radius:0; }
    .composer:focus-within { border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
    .composer textarea { flex:1; min-width:0; min-height:40px; max-height:130px; resize:none; padding:10px 6px; color:var(--text-pri); background:transparent; border:0; border-radius:0; font:13px/1.5 var(--font-ui); outline:0; box-shadow:none; }
    .composer textarea:focus { border:0; box-shadow:none; outline:0; }
    .composer textarea::placeholder { color:var(--text-sec); opacity:.7; }
    .tool-btn { display:grid; place-items:center; width:40px; height:40px; flex:0 0 40px; padding:0; color:var(--text-sec); background:transparent; border:0; border-radius:12px; cursor:pointer; transition:color .15s ease,background .15s ease,transform .15s ease; }
    .tool-btn:hover { color:var(--accent); background:var(--accent-soft); transform:translateY(-1px); }
    .tool-btn:active { transform:scale(.92); }
    .tool-btn svg { width:19px; height:19px; }
    #sendButton { display:grid; place-items:center; width:40px; height:40px; flex:0 0 40px; padding:0; color:var(--accent-ink); background:var(--accent); border:0; border-radius:12px; cursor:pointer; box-shadow:0 6px 16px var(--accent-soft-strong); transition:transform .18s ease,background .18s ease,box-shadow .18s ease,opacity .18s ease; }
    html[data-theme="light"] #sendButton { color:#fff; }
    #sendButton:hover:not(:disabled) { background:var(--accent2); transform:translateY(-2px) rotate(-8deg); box-shadow:0 10px 22px var(--accent-soft-strong); }
    #sendButton:active:not(:disabled) { transform:scale(.9); }
    #sendButton svg { width:18px; height:18px; transition:transform .25s ease; }
    #sendButton:hover:not(:disabled) svg { transform:translateX(2px); }
    #sendButton:disabled { opacity:.55; cursor:progress; animation:send-pulse 1s ease-in-out infinite; }
    @keyframes send-pulse { 50% { transform:scale(.92); } }
    .tool-btn:focus-visible,#sendButton:focus-visible,.starter:focus-visible,.jump-latest:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .char-count { position:absolute; right:60px; top:-9px; padding:1px 8px; color:var(--text-sec); background:var(--bg-panel); border:1px solid var(--border); border-radius:999px; font-size:9.5px; font-weight:700; opacity:0; transform:translateY(4px); transition:opacity .18s ease,transform .18s ease; pointer-events:none; }
    .char-count.show { opacity:1; transform:none; }
    .char-count.warn { color:var(--warning); border-color:var(--warning); }

    /* ---------- Emoji popover ---------- */
    .emoji-pop { position:absolute; z-index:6; left:8px; bottom:calc(100% + 10px); display:grid; grid-template-columns:repeat(6,1fr); gap:2px; width:244px; padding:8px; background:var(--bg-panel); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow-md); opacity:0; transform:translateY(8px) scale(.95); transform-origin:0 100%; pointer-events:none; transition:opacity .16s ease,transform .18s cubic-bezier(.2,.8,.25,1.2); }
    .emoji-pop.open { opacity:1; transform:none; pointer-events:auto; }
    .emoji-pop button { width:34px; height:34px; padding:0; background:transparent; border:0; border-radius:9px; font-size:19px; line-height:1; cursor:pointer; transition:transform .12s ease,background .12s ease; }
    .emoji-pop button:hover { background:var(--accent-soft); transform:scale(1.25); }

    /* ---------- Drag & drop overlay ---------- */
    .drop-veil { position:absolute; z-index:8; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--accent); background:color-mix(in srgb,var(--bg-dark) 72%,transparent); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); border:2px dashed var(--accent); border-radius:20px; font-size:14px; font-weight:750; opacity:0; pointer-events:none; transition:opacity .18s ease; }
    .drop-veil svg { width:38px; height:38px; animation:float 1.6s ease-in-out infinite; }
    .chat-panel.dragging .drop-veil { opacity:1; }

    /* ---------- Image lightbox ---------- */
    .lightbox { position:fixed; z-index:200; inset:0; display:grid; place-items:center; padding:28px; background:rgba(5,9,16,.78); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); opacity:0; pointer-events:none; transition:opacity .2s ease; cursor:zoom-out; }
    .lightbox.open { opacity:1; pointer-events:auto; }
    .lightbox img { max-width:min(94vw,1100px); max-height:88vh; object-fit:contain; border-radius:14px; box-shadow:0 24px 70px rgba(0,0,0,.55); transform:scale(.92); transition:transform .25s cubic-bezier(.2,.8,.25,1.1); }
    .lightbox.open img { transform:none; }
    .lightbox-open-tab { position:absolute; right:18px; top:16px; padding:7px 12px; color:#fff; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); border-radius:999px; font:700 11px var(--font-ui); text-decoration:none; }
    .lightbox-open-tab:hover { background:rgba(255,255,255,.24); }

    @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
    @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-7px); } }
    @keyframes breathe { 0%,100% { box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 14%,transparent); } 50% { box-shadow:0 8px 32px color-mix(in srgb,var(--accent) 36%,transparent); } }

    @media(max-width:520px) {
      .chat-page { padding:10px; }
      .chat-heading { padding-bottom:10px; gap:12px; }
      .chat-messages { padding:14px 12px; }
      .message { max-width:90%; }
      .composer { margin:0 9px 9px; }
      .jump-latest { right:12px; bottom:124px; }
      .emoji-pop { width:214px; grid-template-columns:repeat(6,1fr); }
      .emoji-pop button { width:30px; height:30px; }
    }
    @media(prefers-reduced-motion:reduce) {
      *,*::before,*::after { animation:none !important; transition-duration:.01ms !important; scroll-behavior:auto !important; }
    }
  </style>
</head>
<body>
  <div class="chat-ambient" aria-hidden="true"><i></i><i></i><i></i></div>
  <main class="chat-page">
    <header class="chat-heading">
      <span class="heading-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12Z"/><path d="M8.5 11h7M8.5 14h4"/></svg></span>
      <div class="heading-text"><span class="eyebrow">Team collaboration</span><h1>Team Chat</h1><p>Share updates and coordinate with everyone on your team. All team members can see this conversation.</p></div>
    </header>
    <section class="chat-panel" id="chatPanel" aria-label="Team chat messages">
      <div class="chat-status" id="chatStatus" aria-live="polite">Loading conversation…</div>
      <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-relevant="additions">
        <p class="empty-state" id="emptyState">
          <span class="empty-orb" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12Z"/><path d="M8.5 11h7M8.5 14h4"/></svg></span>
          <span class="empty-title">It’s quiet in here</span>
          <span>No team messages yet. Start the conversation.</span>
          <span class="starter-row">
            <button class="starter" type="button" data-text="Good morning team 👋">Good morning 👋</button>
            <button class="starter" type="button" data-text="Quick update: ">Share an update</button>
            <button class="starter" type="button" data-text="Does anyone have a moment to help? 🙏">Ask for help</button>
          </span>
        </p>
      </div>
      <button class="jump-latest" id="jumpLatest" type="button" aria-label="Jump to latest message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg><span id="jumpLabel">Latest</span><span class="badge" id="jumpBadge">0</span></button>
      <div id="chatError" role="alert"></div>
      <div class="attachment-preview" id="attachmentPreview" hidden><img id="attachmentThumbnail" alt="Selected image preview"><span id="attachmentName"></span><button id="removeAttachment" type="button">Remove image</button></div>
      <form class="composer" id="messageForm">
        <input id="imageInput" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
        <div class="emoji-pop" id="emojiPop" role="menu" aria-label="Insert emoji"></div>
        <button class="tool-btn" id="emojiButton" type="button" aria-label="Insert emoji" aria-expanded="false" title="Emoji"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.2a4.2 4.2 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></svg></button>
        <button class="tool-btn attach-button" id="attachButton" type="button" aria-label="Attach an image" title="Attach an image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.8"/><path d="m21 15-4.5-4.5L6 21"/></svg></button>
        <textarea id="messageInput" maxlength="2000" rows="1" placeholder="Write to your team or paste an image…" aria-label="Message"></textarea>
        <span class="char-count" id="charCount" aria-hidden="true"></span>
        <button id="sendButton" type="submit" aria-label="Send message" title="Send message (Enter)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4 20-7Z"/></svg></button>
      </form>
      <div class="drop-veil" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.8"/><path d="m21 15-4.5-4.5L6 21"/></svg>Drop an image to attach it</div>
    </section>
  </main>
  <div class="lightbox" id="lightbox" role="dialog" aria-label="Image preview" aria-modal="true"><a class="lightbox-open-tab" id="lightboxLink" target="_blank" rel="noopener noreferrer">Open in new tab ↗</a><img id="lightboxImg" alt=""></div>

  <script src="js/common.js"></script>
  <script src="vendor/lucide/lucide.min.js"></script>
  <script src="js/icons.js"></script>
  <script>BeabotsIcons.hydrate();</script>
  <script src="js/team-chat.js"></script>
  <script>
  /* Interactive layer. Additive only: team-chat.js keeps owning loading,
     sending, polling, paste, Enter-to-send and image validation. */
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var list = $("chatMessages"), panel = $("chatPanel"), input = $("messageInput"), form = $("messageForm");
    var jump = $("jumpLatest"), badge = $("jumpBadge"), jumpLabel = $("jumpLabel");
    var errorBox = $("chatError"), statusBox = $("chatStatus");
    var imageInput = $("imageInput"), count = $("charCount");
    var pop = $("emojiPop"), emojiBtn = $("emojiButton");
    var lightbox = $("lightbox"), lbImg = $("lightboxImg"), lbLink = $("lightboxLink");
    var unread = 0, msgIndex = 0;

    /* ----- Message grouping + stagger + unread counter (append-only list) ----- */
    function authorKey(el) {
      var s = el.querySelector(".message-meta strong");
      return (el.classList.contains("own") ? "own:" : "") + (s ? s.textContent : "");
    }
    function nearBottom() { return list.scrollHeight - list.scrollTop - list.clientHeight < 90; }
    function updateJump() {
      var away = !nearBottom();
      jump.classList.toggle("show", away);
      if (!away) { unread = 0; }
      badge.textContent = unread;
      jump.classList.toggle("has-new", unread > 0);
      jumpLabel.textContent = unread > 0 ? "New" : "Latest";
    }
    function enhance(n) {
      if (!n.classList || !n.classList.contains("message") || n.dataset.enh) return;
      n.dataset.enh = "1";
      n.style.setProperty("--i", msgIndex++);
      var prev = n.previousElementSibling;
      while (prev && !prev.classList.contains("message")) prev = prev.previousElementSibling;
      if (prev && authorKey(prev) === authorKey(n)) n.classList.add("grouped");
      if (n.classList.contains("own") && document.body.classList.contains("sent-live")) n.classList.add("just-sent");
      if (!n.classList.contains("own") && list.scrollHeight - list.scrollTop - list.clientHeight > 200) unread++;
    }
    list.querySelectorAll(".message").forEach(enhance);
    new MutationObserver(function (records) {
      records.forEach(function (r) { r.addedNodes.forEach(enhance); });
      requestAnimationFrame(updateJump);
    }).observe(list, { childList: true });
    /* Keep the view pinned to the newest message while images finish loading. */
    var stick = true;
    list.addEventListener("scroll", function () { stick = nearBottom(); }, { passive: true });
    list.addEventListener("load", function (e) {
      if (e.target && e.target.tagName === "IMG" && stick) { list.scrollTop = list.scrollHeight; updateJump(); }
    }, true);
    list.addEventListener("scroll", updateJump, { passive: true });
    jump.addEventListener("click", function () { list.scrollTo({ top: list.scrollHeight, behavior: "smooth" }); });
    form.addEventListener("submit", function () {
      document.body.classList.add("sent-live");
      setTimeout(fit, 60); setTimeout(fit, 500); setTimeout(updateCount, 60);
    });

    /* ----- Error / status styling hooks ----- */
    new MutationObserver(function () {
      panel.classList.toggle("has-error", !!errorBox.textContent.trim());
    }).observe(errorBox, { childList: true, characterData: true, subtree: true });

    /* ----- Textarea autogrow + character counter ----- */
    function fit() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 130) + "px";
    }
    function updateCount() {
      var left = input.maxLength - input.value.length;
      var show = input.value.length > input.maxLength * 0.75;
      count.classList.toggle("show", show);
      count.classList.toggle("warn", left < 100);
      count.textContent = left + " left";
    }
    input.addEventListener("input", function () { fit(); updateCount(); });
    fit();

    /* ----- Starter chips in the empty state ----- */
    document.querySelectorAll(".starter").forEach(function (b) {
      b.addEventListener("click", function () {
        input.value = b.dataset.text; fit(); updateCount(); input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      });
    });

    /* ----- Emoji picker ----- */
    "😀 😂 😍 👍 🙏 🎉 🔥 ✅ 👀 💡 ❤️ 😅 🤔 👏 🚀 ⚠️ 📌 ☕".split(" ").forEach(function (e) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = e; b.setAttribute("role", "menuitem"); b.setAttribute("aria-label", "Insert " + e);
      b.addEventListener("click", function () {
        var s = input.selectionStart, t = input.selectionEnd;
        input.setRangeText(e, s, t, "end");
        input.dispatchEvent(new Event("input", { bubbles: true }));
        input.focus();
      });
      pop.appendChild(b);
    });
    function setPop(open) { pop.classList.toggle("open", open); emojiBtn.setAttribute("aria-expanded", String(open)); }
    emojiBtn.addEventListener("click", function (e) { e.stopPropagation(); setPop(!pop.classList.contains("open")); });
    document.addEventListener("click", function (e) { if (!pop.contains(e.target)) setPop(false); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { setPop(false); closeLightbox(); }
    });

    /* ----- Drag & drop an image onto the panel ----- */
    var depth = 0;
    function hasFiles(e) { return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], "Files") > -1; }
    panel.addEventListener("dragenter", function (e) { if (!hasFiles(e)) return; e.preventDefault(); depth++; panel.classList.add("dragging"); });
    panel.addEventListener("dragover", function (e) { if (hasFiles(e)) e.preventDefault(); });
    panel.addEventListener("dragleave", function () { depth = Math.max(0, depth - 1); if (!depth) panel.classList.remove("dragging"); });
    panel.addEventListener("drop", function (e) {
      if (!hasFiles(e)) return;
      e.preventDefault(); depth = 0; panel.classList.remove("dragging");
      var f = Array.prototype.find.call(e.dataTransfer.files, function (x) { return x.type.indexOf("image/") === 0; });
      if (!f) { errorBox.textContent = "Choose a PNG, JPEG, GIF, or WebP image."; return; }
      try {
        var dt = new DataTransfer(); dt.items.add(f);
        imageInput.files = dt.files;
        imageInput.dispatchEvent(new Event("change", { bubbles: true }));
        input.focus();
      } catch (err) { errorBox.textContent = "Could not attach that image."; }
    });

    /* ----- Image lightbox ----- */
    function closeLightbox() { lightbox.classList.remove("open"); }
    list.addEventListener("click", function (e) {
      var link = e.target.closest && e.target.closest(".message-image-link");
      if (!link || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
      e.preventDefault();
      lbImg.src = link.href; lbImg.alt = (link.querySelector("img") || {}).alt || "";
      lbLink.href = link.href;
      lightbox.classList.add("open");
    });
    lightbox.addEventListener("click", function (e) { if (e.target !== lbLink) closeLightbox(); });
  })();
  </script>
</body>
</html>
