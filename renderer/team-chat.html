<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Chat | Beabots</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/theme.css">
  <style>
    html,body { width:100%; height:100%; overflow:hidden; }
    body { color:var(--text-pri); background:var(--bg-dark); }
    .chat-page { display:flex; width:min(100%,980px); height:100%; min-height:0; flex-direction:column; margin:0 auto; padding:clamp(16px,3vw,32px); }
    .chat-heading { flex:none; padding-bottom:17px; }
    .eyebrow { color:var(--accent); font-size:10px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; }
    h1 { margin:6px 0; font-size:clamp(23px,4vw,30px); letter-spacing:-.7px; }
    .chat-heading p { margin:0; color:var(--text-sec); font-size:12px; }
    .chat-panel { display:flex; flex:1; min-height:0; flex-direction:column; overflow:hidden; background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); }
    .chat-panel { flex:1; min-width:0; }
    .chat-status { flex:none; padding:10px 15px; color:var(--text-sec); border-bottom:1px solid var(--border); font-size:10px; }
    .chat-messages { display:flex; flex:1; min-height:0; flex-direction:column; gap:12px; overflow-y:auto; padding:17px; overscroll-behavior:contain; }
    .empty-state { margin:auto; color:var(--text-sec); font-size:12px; text-align:center; }
    .message { max-width:min(78%,620px); padding:10px 12px; background:var(--bg-card); border:1px solid var(--border); border-radius:12px 12px 12px 3px; overflow-wrap:anywhere; }
    .message,.message * { user-select:text; -webkit-user-select:text; }
    .message.own { align-self:flex-end; background:var(--accent-soft); border-color:color-mix(in srgb,var(--accent) 30%,var(--border)); border-radius:12px 12px 3px 12px; }
    .message-meta { display:flex; align-items:center; gap:9px; margin-bottom:4px; }
    .message-meta strong { color:var(--accent); font-size:10px; }
    .message-meta time { color:var(--text-sec); font-size:9px; }
    .message-body { color:var(--text-pri); font-size:12px; line-height:1.55; white-space:pre-wrap; cursor:text; }
    .message-image-link { display:block; max-width:100%; margin-top:8px; }
    .message-image { display:block; width:auto; max-width:min(100%,520px); max-height:350px; border:1px solid var(--border); border-radius:8px; object-fit:contain; }
    .attachment-preview { display:flex; align-items:center; gap:9px; padding:9px 12px 0; color:var(--text-sec); font-size:10px; }
    .attachment-preview[hidden] { display:none; }
    .attachment-preview img { width:44px; height:44px; object-fit:cover; border:1px solid var(--border); border-radius:6px; }
    .attachment-preview span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .attachment-preview button,.attach-button { min-height:36px; padding:0 10px; color:var(--text-pri); background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); font:700 10px var(--font-ui); cursor:pointer; }
    .attachment-preview button:hover,.attach-button:hover { border-color:var(--accent); }
    .composer { display:flex; flex:none; align-items:flex-end; gap:9px; padding:12px; border-top:1px solid var(--border); }
    .composer textarea { flex:1; min-width:0; min-height:42px; max-height:130px; resize:vertical; padding:10px 12px; color:var(--text-pri); background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); font:12px/1.45 var(--font-ui); }
    .composer textarea:focus { border-color:var(--accent); outline:2px solid var(--accent-soft); }
    .composer button { min-height:42px; padding:0 16px; color:#06121b; background:var(--accent); border:1px solid var(--accent); border-radius:var(--radius-md); font:750 11px var(--font-ui); cursor:pointer; }
    .composer button:disabled { opacity:.5; cursor:not-allowed; }
    #chatError { min-height:17px; padding:0 13px 8px; color:var(--error); font-size:10px; }
    @media(max-width:520px) { .chat-page { padding:14px; } .chat-heading { padding-bottom:12px; } .chat-messages { padding:12px; } .message { max-width:90%; } .composer { gap:7px; padding:9px; } .composer button { padding:0 12px; } }
  </style>
</head>
<body>
  <main class="chat-page">
    <header class="chat-heading"><span class="eyebrow">Team collaboration</span><h1>Team Chat</h1><p>Share updates and coordinate with everyone on your team. All team members can see this conversation.</p></header>
    <section class="chat-panel" aria-label="Team chat messages">
      <div class="chat-status" id="chatStatus" aria-live="polite">Loading conversation…</div>
      <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-relevant="additions">
        <p class="empty-state" id="emptyState">No team messages yet. Start the conversation.</p>
      </div>
      <div id="chatError" role="alert"></div>
      <div class="attachment-preview" id="attachmentPreview" hidden><img id="attachmentThumbnail" alt="Selected image preview"><span id="attachmentName"></span><button id="removeAttachment" type="button">Remove image</button></div>
      <form class="composer" id="messageForm">
        <input id="imageInput" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
        <button class="attach-button" id="attachButton" type="button" aria-label="Attach an image">＋ Image</button>
        <textarea id="messageInput" maxlength="2000" rows="1" placeholder="Write to your team…" aria-label="Message"></textarea>
        <button id="sendButton" type="submit">Send</button>
      </form>
    </section>
  </main>
  <script src="js/common.js"></script>
  <script src="js/team-chat.js"></script>
</body>
</html>
