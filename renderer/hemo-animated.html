<style>

<h1 class="sr">Hemodialysis in Ten Seconds</h1>
<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="gl" role="img" aria-label="3D animation: blood leaves the patient's arm, is pumped through a dialyzer where waste and excess fluid are removed, then returns clean to the body."></canvas>
    <div class="hud">
      <ul class="legend">
        <li><i style="background:var(--blood)"></i>Blood</li>
        <li><i style="background:var(--waste)"></i>Waste</li>
        <li><i style="background:var(--fluid)"></i>Excess fluid</li>
        <li><i style="background:var(--accent)"></i>Dialysate</li>
      </ul>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div id="callouts"></div>
    <div class="cap">
      <div class="steps" id="steps"><i></i><i></i><i></i><i></i></div>
      <div class="cap-in" id="caps"></div>
    </div>
    <div class="nogl" id="nogl" hidden>This animation needs WebGL, which is not available in this browser.</div>
  </div>
  <div class="ctl">
    <button id="play" type="button" aria-label="Pause"></button>
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Animation time">
    <output id="time" for="scrub">0.0 s</output>
  </div>
  <p class="note">Stylized educational model, not to scale. Loops every 10 seconds.</p>
</div>

<script>

var LB=LA+LD+LV,vB=LB/T;
var LDI=curveDI.getLength(),LDO=curveDO.getLength(),PORT=0.53,LSH=2.0;

}
addTube(curveA,0.10,0.074,glassMat(0xbfe9f7,0.22),new THREE.MeshPhongMaterial({color:0x7a0f20,emissive:0x3a0510,shininess:60}));

/* ---------- machine ---------- */
var machine=new THREE.Mesh(new THREE.BoxGeometry(6.4,2.8,1.4),solid(0x12303e,40,0x04121a));
machine.position.set(0,-4.0,-0.7);scene.add(machine);
var strip=new THREE.Mesh(new THREE.BoxGeometry(6.4,0.05,1.4),new THREE.MeshBasicMaterial({color:0x27d3c4}));
strip.position.set(0,-2.6,-0.7);scene.add(strip);

[0,1,2].forEach(function(i){var led=new THREE.Mesh(new THREE.SphereGeometry(0.05,12,8),new THREE.MeshBasicMaterial({color:i===2?0xf2b632:0x41e08a}));led.position.set(-2.9+i*0.2,-2.85,0.02);scene.add(led);});

trap.add(new THREE.Mesh(new THREE.CylinderGeometry(0.21,0.21,0.85,24,1,true),glassMat(0xd8f3fb,0.26,true)));
var tf=new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.17,0.56,24),new THREE.MeshPhongMaterial({color:0xe11d2e,emissive:0x5a0610,transparent:true,opacity:0.85}));tf.position.y=-0.13;trap.add(tf);
[-0.45,0.45].forEach(function(y){var cap=new THREE.Mesh(new THREE.CylinderGeometry(0.23,0.23,0.08,24),solid(0x31515f,50));cap.position.y=y;trap.add(cap);});

var dz=new THREE.Group();scene.add(dz);
dz.add(new THREE.Mesh(new THREE.CylinderGeometry(0.85,0.85,2.6,48,1,true),glassMat(0xbfe9f7,0.13,true)));
[-1,1].forEach(function(s){

var fibers=[];

  for(var i=0;i<p.count;i++){tmp.copy(cv).lerp(cb,sstep(0.15,0.85,(p.getY(i)+1.3)/2.6));cols[i*3]=tmp.r;cols[i*3+1]=tmp.g;cols[i*3+2]=tmp.b;}

  var a=new THREE.Mesh(fGeo,fMat),b=new THREE.Mesh(mGeo,mMat);

});

/* ---------- atmosphere ---------- */
function glowTex(){var c=document.createElement('canvas');c.width=c.height=128;var g=c.getContext('2d');var gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,255,255,0.9)');gr.addColorStop(0.35,'rgba(255,255,255,0.25)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);}
var gt=glowTex();
var glow=new THREE.Sprite(new THREE.SpriteMaterial({map:gt,color:0x27d3c4,transparent:true,opacity:0.3,depthWrite:false,blending:THREE.AdditiveBlending}));
glow.scale.set(7.5,7.5,1);glow.position.set(0,0,-1.6);scene.add(glow);
var glowK=new THREE.Sprite(new THREE.SpriteMaterial({map:gt,color:0xff5a6a,transparent:true,opacity:0.2,depthWrite:false,blending:THREE.AdditiveBlending}));
glowK.scale.set(4.5,4.5,1);glowK.position.set(0,3.5,-0.8);scene.add(glowK);
var dustPos=new Float32Array(150*3);
for(var di=0;di<150;di++){dustPos[di*3]=(R()-0.5)*11;dustPos[di*3+1]=(R()-0.5)*14;dustPos[di*3+2]=-4+R()*7;}
var dustGeo=new THREE.BufferGeometry();dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPos,3));
var dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({size:0.04,color:0x9fe9f5,transparent:true,opacity:0.35,depthWrite:false}));scene.add(dust);

/* ---------- particles ---------- */
var D=new THREE.Object3D();
function inst(n,geo,mat){var m=new THREE.InstancedMesh(geo,mat,n);m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);m.frustumCulled=false;scene.add(m);return m;}
function put(m,i,x,y,z,sx,sy,sz){D.position.set(x,y,z);D.scale.set(sx,sy,sz);D.updateMatrix();m.setMatrixAt(i,D.matrix);}
var sph=new THREE.SphereGeometry(1,10,8);
var NC=260,NW=84,NF=56,ND=110;
var cells=inst(NC,sph,new THREE.MeshPhongMaterial({color:0xffffff,emissive:0x2a0508,shininess:50}));
var wasteM=inst(NW,sph,new THREE.MeshPhongMaterial({color:0xf2b632,emissive:0xa06a00,shininess:80}));
var fluidM=inst(NF,sph,new THREE.MeshPhongMaterial({color:0x8fdcff,emissive:0x2a7fa8,transparent:true,opacity:0.85,shininess:120}));
var dialM=inst(ND,sph,new THREE.MeshBasicMaterial({color:0x27d3c4,transparent:true,opacity:0.9}));
var cellItems=[],wasteItems=[],fluidItems=[],dialItems=[];
var col=new THREE.Color(),cV=new THREE.Color(0x7a0f20),cB=new THREE.Color(0xe11d2e);
function jit(s){return (R()-0.5)*2*s;}
for(var i=0;i<NC;i++){cellItems.push({o:(i+R()*0.6)/NC,f:fibers[(R()*fibers.length)|0],jx:jit(0.035),jy:jit(0.035),jz:jit(0.035)});cells.setColorAt(i,cV);}
function mk(n,tx0,tx1){var a=[];for(var i=0;i<n;i++)a.push({o:(i+R()*0.6)/n,f:outerFibers[(R()*outerFibers.length)|0],yc:-0.85+R()*1.35,tx:tx0+R()*(tx1-tx0),rt:0.775,jx:jit(0.035),jy:jit(0.035),jz:jit(0.035)});return a;}
wasteItems=mk(NW,0.8,1.0);fluidItems=mk(NF,0.7,0.9);
for(var j=0;j<ND;j++){var ra=R()*Math.PI*2,rr=Math.sqrt(R())*0.7;dialItems.push({o:(j+R()*0.6)/ND,rx:Math.cos(ra)*rr,rz:Math.sin(ra)*rr});}

var tmpP=new THREE.Vector3(),lastFan=0;
function fanAt(d){return sstep(0,0.5,d)*(1-sstep(LD-0.5,LD,d));}
function bloodAt(d,f,out){
  lastFan=0;
  if(d<LA){curveA.getPointAt(d/LA,out);return 0;}
  d-=LA;
  if(d<LD){lastFan=fanAt(d);out.set(f.x*lastFan,DY0+d,f.z*lastFan);return sstep(0.25,0.8,d/LD);}
  d-=LD;curveV.getPointAt(Math.min(d/LV,1),out);return 1;
}
var grow=1;
function travel(it,t,out){
  var tau=((it.o+t/T)%1)*T,tA=LA/vB,dC=it.yc-DY0,tIn=dC/vB,tX=it.tx;grow=1;
  if(tau<tA){curveA.getPointAt(tau/tA,out);out.x+=it.jx;out.y+=it.jy;out.z+=it.jz;return Math.min(1,tau/0.35);}
  tau-=tA;
  if(tau<tIn){var d=tau*vB,fn=fanAt(d);out.set(it.f.x*fn,DY0+d,it.f.z*fn);return 1;}
  tau-=tIn;
  if(tau<tX){var k=sstep(0,1,tau/tX),rr=it.f.r+(it.rt-it.f.r)*k;out.set(Math.cos(it.f.a)*rr,it.yc+0.18*k,Math.sin(it.f.a)*rr);grow=1+0.5*k;return 1;}
  tau-=tX;grow=1.5;
  var rem=T-(tA+tIn+tX),u=Math.min(tau/rem,1),x1=Math.cos(it.f.a)*it.rt,z1=Math.sin(it.f.a)*it.rt,y1=it.yc+0.18;
  if(u<0.35){var k1=u/0.35;out.set(x1,y1+(-0.9-y1)*k1,z1);}
  else if(u<0.5){var k2=(u-0.35)/0.15;out.set(x1+(1.15-x1)*k2,-0.9-0.1*k2,z1*(1-k2));}
  else{curveDO.getPointAt(Math.min((u-0.5)/0.5,1),out);}
  return u>0.9?Math.max(0,(1-u)/0.1):1;
}
function dialAt(it,t,out){
  var q=((it.o+t/T)%1)*LDT,k;
  if(q<LDI){curveDI.getPointAt(q/LDI,out);return;}
  q-=LDI;
  if(q<PORT){k=q/PORT;out.set(1.15+(0.62-1.15)*k,1.0,0);return;}
  q-=PORT;
  if(q<LSH){k=q/LSH;var w=sstep(0,0.25,k)*(1-sstep(0.75,1,k));out.set(0.62+(it.rx-0.62)*w,1.0-2.0*k,it.rz*w);return;}
  q-=LSH;
  if(q<PORT){k=q/PORT;out.set(0.62+(1.15-0.62)*k,-1.0,0);return;}
  q-=PORT;curveDO.getPointAt(Math.min(q/LDO,1),out);
}
function updateParticles(t){
  var i,it,c,s;
  for(i=0;i<NC;i++){
    it=cellItems[i];c=bloodAt(((it.o+t/T)%1)*LB,it.f,tmpP);
    var jf=1-lastFan;s=0.05-0.016*lastFan;
    put(cells,i,tmpP.x+it.jx*jf,tmpP.y+it.jy*jf,tmpP.z+it.jz*jf,s,s*0.7,s);
    col.copy(cV).lerp(cB,c);cells.setColorAt(i,col);
  }
  cells.instanceMatrix.needsUpdate=true;cells.instanceColor.needsUpdate=true;
  for(i=0;i<NW;i++){s=travel(wasteItems[i],t,tmpP)*0.044*grow;put(wasteM,i,tmpP.x,tmpP.y,tmpP.z,s,s,s);}
  wasteM.instanceMatrix.needsUpdate=true;
  for(i=0;i<NF;i++){s=travel(fluidItems[i],t,tmpP)*0.042*(grow>1?grow*1.15:1);put(fluidM,i,tmpP.x,tmpP.y,tmpP.z,s,s,s);}
  fluidM.instanceMatrix.needsUpdate=true;
  for(i=0;i<ND;i++){dialAt(dialItems[i],t,tmpP);put(dialM,i,tmpP.x,tmpP.y,tmpP.z,0.026,0.026,0.026);}
  dialM.instanceMatrix.needsUpdate=true;
}

/* ---------- camera ---------- */
/* t, focus x,y,z, distance, azimuth, elevation */
var K=[
  [0,    0,1.1,0,    17.5, 0,     0.05],
  [1.25, -1.15,3.45,0, 9.2, 0.2,  0.06],
  [3.1,  -1.5,-2.4,0.2, 7.8, 0.22, 0.05],
  [4.4,  0,-0.1,0,    9.0, -0.25, 0.06],
  [5.8,  0.1,0,0.1,   6.0, 0.42,  0.1],
  [7.2,  0.15,0.2,0.1, 6.4, 0.12, 0.08],
  [8.4,  1.15,2.2,0.2, 8.6, -0.25,0.05],
  [10,   0,1.1,0,    17.5, 0,     0.05]
];
var cv6=[0,0,0,0,0,0];
function camAt(t){
  var n=K.length,i=0;
  while(i<n-2&&t>=K[i+1][0])i++;
  var a=K[i],b=K[i+1],p=K[i===0?n-2:i-1],q=K[i+2<n?i+2:1];
  var tp=i===0?p[0]-T:p[0],tq=i+2<n?q[0]:q[0]+T;
  var h=b[0]-a[0],s=(t-a[0])/h,s2=s*s,s3=s2*s;
  var h00=2*s3-3*s2+1,h10=s3-2*s2+s,h01=-2*s3+3*s2,h11=s3-s2;
  for(var c=1;c<=6;c++){
    var m0=(b[c]-p[c])/(b[0]-tp),m1=(q[c]-a[c])/(tq-a[0]);
    cv6[c-1]=h00*a[c]+h10*h*m0+h01*b[c]+h11*h*m1;
  }
  var d=cv6[3],az=cv6[4],el=cv6[5];
  camera.position.set(cv6[0]+d*Math.sin(az)*Math.cos(el),cv6[1]+d*Math.sin(el),cv6[2]+d*Math.cos(az)*Math.cos(el));
  camera.lookAt(cv6[0],cv6[1]-0.11*d*0.727,cv6[2]);
}

/* ---------- captions & callouts ---------- */
var CAPS=[
  {w:[0.1,1.3],k:'3D animation',t:'Hemodialysis',d:'How a dialysis machine does the work of failing kidneys.'},
  {w:[1.3,3.1],k:'01',t:'Blood leaves the body',d:'Blood is drawn from the arm access into sterile tubing.'},
  {w:[3.1,4.4],k:'02',t:'A pump drives the circuit',d:'A roller pump pushes blood toward the filter at 300 to 400 mL per minute.'},
  {w:[4.4,7.3],k:'03',t:'The dialyzer filters it',d:'Waste and extra fluid cross the membrane into the dialysate. Blood cells stay inside.'},
  {w:[7.3,8.9],k:'04',t:'Clean blood returns',d:'Filtered blood passes an air trap, then flows back into the body.'},
  {w:[8.9,9.9],k:'Per treatment',t:'About 4 hours',d:'Usually 3 to 4 hours, three times a week.'}
];
var capsEl=$('caps');
CAPS.forEach(function(c){
  var el=document.createElement('div');el.className='c';
  el.innerHTML='<div class="k"></div><h2></h2><p></p>';
  el.children[0].textContent=c.k;el.children[1].textContent=c.t;el.children[2].textContent=c.d;
  capsEl.appendChild(el);c.el=el;
});
var stepEls=$('steps').children;
var COS=[
  {a:[-2.0,2.9,0.3],  w:[0.7,3.0],  t:'Vascular access',  s:'Blood drawn from the arm',   side:'r',c:'#27d3c4'},
  {a:[-1.6,-2.95,0.4],w:[3.0,4.4],  t:'Blood pump',       s:'Roller pump',               side:'r',c:'#27d3c4'},
  {a:[0.3,1.15,0.7],  w:[4.3,5.5],  t:'Hollow-fiber membrane',s:'Thousands of hair-thin tubes',side:'r',c:'#27d3c4'},
  {a:[0.2,-0.4,0.85], w:[5.2,6.5],  t:'Waste',            s:'Urea, creatinine, toxins',  side:'l',c:'#f2b632'},
  {a:[-0.45,0.7,0.8], w:[5.9,7.1],  t:'Excess fluid',     s:'Drawn out through the pores',side:'r',c:'#8fdcff'},
  {a:[0.85,-1.0,0.2], w:[6.4,7.4],  t:'Dialysate',        s:'Flows the opposite way',    side:'l',c:'#27d3c4'},
  {a:[1.75,2.2,0.5],  w:[7.2,8.3],  t:'Air trap',         s:'Safety check before return',side:'l',c:'#27d3c4'},
  {a:[2.0,2.9,0.3],   w:[8.2,9.4],  t:'Clean blood',      s:'Returned to the body',      side:'l',c:'#e11d2e'}
];
var coWrap=$('callouts');
COS.forEach(function(c){
  var el=document.createElement('div');el.className='co '+c.side;el.style.setProperty('--c',c.c);
  el.innerHTML='<i class="dot"></i><span class="ln"></span><div class="tx"><b></b><small></small></div>';
  el.querySelector('b').textContent=c.t;el.querySelector('small').textContent=c.s;
  coWrap.appendChild(el);c.el=el;c.tx=el.querySelector('.tx');c.v=V3(c.a);c.cls=c.side;c.tw=0;
});
var pv=new THREE.Vector3();
function overlays(t,W,H){
  var i,o;
  for(i=0;i<CAPS.length;i++){
    o=win(t,CAPS[i].w[0],CAPS[i].w[1],0.25);
    CAPS[i].el.style.opacity=o.toFixed(3);
    CAPS[i].el.style.transform='translateY('+((1-o)*8).toFixed(1)+'px)';
  }
  var step=t<1.3?0:t<3.1?1:t<4.4?2:t<7.3?3:t<8.9?4:0;
  for(i=0;i<4;i++){stepEls[i].className=(i+1<step)?'done':(i+1===step?'on':'');}
  for(i=0;i<COS.length;i++){
    var c=COS[i];o=win(t,c.w[0],c.w[1],0.25);
    if(o<0.01){c.el.style.opacity=0;continue;}
    pv.copy(c.v).project(camera);
    var x=(pv.x*0.5+0.5)*W,y=(-pv.y*0.5+0.5)*H;
    if(pv.z>1||x<-20||x>W+20||y<-20||y>H+20){c.el.style.opacity=0;continue;}
    if(!c.tw)c.tw=c.tx.offsetWidth||140;
    var side=c.side;
    if(side==='r'&&x+27+c.tw>W-8)side='l';
    else if(side==='l'&&x-27-c.tw<8)side='r';
    if(side!==c.cls){c.el.className='co '+side;c.cls=side;}
    c.el.style.opacity=o.toFixed(3);
    c.el.style.transform='translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,0)';
  }
}

/* ---------- frame ---------- */
var W=1,H=1;
function resize(){
  W=stage.clientWidth;H=stage.clientHeight;if(!W||!H)return;
  renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();
}
if(window.ResizeObserver){new ResizeObserver(resize).observe(stage);}else{window.addEventListener('resize',resize);}
resize();

function draw(t){
  camAt(t);
  rotor.rotation.z=t/T*Math.PI*2*3;
  var pulse=0.5+0.5*Math.sin(t/T*Math.PI*2*5);
  kidneys.forEach(function(k){k.material.emissive.setRGB(0.35+0.18*pulse,0.06,0.1);});
  glow.material.opacity=0.2+0.4*win(t,4.0,7.8,1.0);
  glowK.material.opacity=0.14+0.08*pulse;
  dust.position.y=Math.sin(t/T*Math.PI*2)*0.2;
  dust.rotation.y=Math.sin(t/T*Math.PI*2)*0.05;
  updateParticles(t);
  camera.updateMatrixWorld();
  overlays(t,W,H);
  renderer.render(scene,camera);
}

/* ---------- transport ---------- */
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var playing=!reduce,Tn=reduce?5.8:0,dragging=false,last=null,visible=!('IntersectionObserver' in window),rafId=0;
var btn=$('play'),scrub=$('scrub'),timeEl=$('time'),barEl=$('bar');
var ICON_PAUSE='<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.4" height="12" rx="1" fill="currentColor"/><rect x="9.6" y="2" width="3.4" height="12" rx="1" fill="currentColor"/></svg>';
var ICON_PLAY='<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.2v11.6a.6.6 0 0 0 .9.5l9-5.8a.6.6 0 0 0 0-1L4.9 1.7a.6.6 0 0 0-.9.5z" fill="currentColor"/></svg>';
function setBtn(){btn.innerHTML=playing?ICON_PAUSE:ICON_PLAY;btn.setAttribute('aria-label',playing?'Pause':'Play');}
setBtn();
btn.addEventListener('click',function(){playing=!playing;setBtn();});
scrub.addEventListener('pointerdown',function(){dragging=true;});
window.addEventListener('pointerup',function(){dragging=false;});
scrub.addEventListener('input',function(){Tn=Math.min(T-0.001,scrub.value/1000*T);});
function canRender(){return visible&&document.visibilityState==='visible';}
function setRenderState(){
  if(canRender()){
    last=null;
    if(!rafId)rafId=requestAnimationFrame(loop);
  }else if(rafId){
    cancelAnimationFrame(rafId);
    rafId=0;
    last=null;
  }
}
if('IntersectionObserver' in window){
  new IntersectionObserver(function(entries){
    visible=entries[0].isIntersecting;
    setRenderState();
  }).observe(stage);
}
document.addEventListener('visibilitychange',setRenderState);
function loop(now){
  rafId=0;
  if(!canRender())return;
  var dt=last===null?0:Math.min(0.1,Math.max(0,(now-last)/1000));last=now;
  if(playing&&!dragging)Tn=(Tn+dt)%T;
  if(!dragging)scrub.value=Math.round(Tn/T*1000);
  timeEl.textContent=Tn.toFixed(1)+' s';
  barEl.style.width=(Tn/T*100).toFixed(2)+'%';
  draw(Tn);
  rafId=requestAnimationFrame(loop);
}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){COS.forEach(function(c){c.tw=0;});});}
setRenderState();
})();
</script>
