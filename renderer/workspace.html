<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1424">
  <title>Beabots | Workspace</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/workspace.css">
</head>
<body class="workspace-page">
  <div class="workspace-shell" id="workspaceShell">


    <div class="workspace-body">
      <aside class="workspace-sidebar" id="workspaceSidebar" aria-label="Workspace navigation">
        <div class="workspace-sidebar-brand"><a class="workspace-brand" href="/workspace.html" aria-label="Beabots dashboard"><img src="assets/bot.ico" alt=""><span><strong>BEABOTS</strong><small>BEACON AUTOMATION</small></span></a></div>
        <div class="workspace-sidebar-top"><span>WORKSPACE</span><button id="workspaceSidebarCollapse" type="button" aria-label="Collapse sidebar" aria-expanded="true" title="Collapse sidebar"><span aria-hidden="true">‹</span></button></div>
        <nav class="workspace-nav">
          <button class="workspace-nav-link" type="button" data-workspace="dashboard" title="Dashboard"><span class="workspace-nav-icon" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m2.5 9 7.5-6 7.5 6v7.2a1 1 0 0 1-1 1h-4.3v-5.1H7.8v5.1H3.5a1 1 0 0 1-1-1z"/></svg></span><span>Dashboard</span></button>
          <section class="workspace-nav-group">
            <button class="workspace-nav-link workspace-group-trigger" type="button" data-nav-group="soa" data-collapsed-workspace="soaExcel" data-collapsed-soa-tab="individual" aria-expanded="false" aria-controls="workspaceSoaSubnav" title="SOA Generator"><span class="workspace-nav-icon" aria-hidden="true">▦</span><span>SOA Generator</span><span class="workspace-group-chevron" aria-hidden="true">+</span></button>
            <div class="workspace-subnav" id="workspaceSoaSubnav" hidden>
              <button class="workspace-nav-link" type="button" data-workspace="soaExcel" data-soa-tab="individual"><span class="workspace-nav-icon" aria-hidden="true">●</span><span>Individual</span></button>
              <button class="workspace-nav-link" type="button" data-workspace="soaExcel" data-soa-tab="batch"><span class="workspace-nav-icon" aria-hidden="true">☷</span><span>Batch Generate</span></button>
            </div>
          </section>
          <section class="workspace-nav-group">
            <button class="workspace-nav-link workspace-group-trigger" type="button" data-nav-group="automation" data-collapsed-workspace="cf2" aria-expanded="false" aria-controls="workspaceAutomationSubnav" title="Automation"><span class="workspace-nav-icon" aria-hidden="true">⟳</span><span>Automation</span><span class="workspace-group-chevron" aria-hidden="true">+</span></button>
            <div class="workspace-subnav" id="workspaceAutomationSubnav" hidden>
              <button class="workspace-nav-link" type="button" data-workspace="cf2"><span class="workspace-nav-icon" aria-hidden="true">Ⅱ</span><span>Claim Form 2</span></button>
              <button class="workspace-nav-link" type="button" data-workspace="uploadSoa"><span class="workspace-nav-icon" aria-hidden="true">↑</span><span>Upload SOA</span></button>
              <button class="workspace-nav-link" type="button" data-workspace="cf4"><span class="workspace-nav-icon" aria-hidden="true">Ⅳ</span><span>Claim Form 4</span></button>
              <button class="workspace-nav-link" type="button" data-workspace="uploadDocuments"><span class="workspace-nav-icon" aria-hidden="true">▤</span><span>Upload Documents</span></button>
            </div>
          </section>
          <button class="workspace-nav-link" type="button" data-workspace="editClaims" title="Edit claims"><span class="workspace-nav-icon" aria-hidden="true">✓</span><span>Edit Claims</span></button>
          <button class="workspace-nav-link" type="button" data-workspace="runAll" title="Run full workflow"><span class="workspace-nav-icon" aria-hidden="true">▶</span><span>Run Full Workflow</span></button>
          <section class="workspace-nav-group">
            <button class="workspace-nav-link workspace-group-trigger" type="button" data-nav-group="tools" data-collapsed-workspace="autoRename" aria-expanded="false" aria-controls="workspaceToolsSubnav" title="Other tools"><span class="workspace-nav-icon" aria-hidden="true">⚒</span><span>Other Tools</span><span class="workspace-group-chevron" aria-hidden="true">+</span></button>
            <div class="workspace-subnav" id="workspaceToolsSubnav" hidden>
              <button class="workspace-nav-link" type="button" data-workspace="autoRename"><span class="workspace-nav-icon" aria-hidden="true">✎</span><span>PDF Auto Rename</span></button>
              <a class="workspace-nav-link external-link" href="https://rgonzaga19.github.io/pdfsplitter/" target="_blank" rel="noopener noreferrer"><span class="workspace-nav-icon" aria-hidden="true">✂</span><span>PDF Splitter ↗</span></a>
              <a class="workspace-nav-link external-link" href="https://rgonzaga19.github.io/pdfeditor/" target="_blank" rel="noopener noreferrer"><span class="workspace-nav-icon" aria-hidden="true">▧</span><span>PDF Editor ↗</span></a>
              <a class="workspace-nav-link external-link" href="https://rgonzaga19.github.io/nephro_dtrgenerator/" target="_blank" rel="noopener noreferrer"><span class="workspace-nav-icon" aria-hidden="true">▤</span><span>DTR Generator ↗</span></a>
            </div>
          </section>
          <button class="workspace-nav-link" type="button" data-workspace="teamCollab" title="Team chat"><span class="workspace-nav-icon" aria-hidden="true">▤</span><span>Team Chat</span></button>
          <button class="workspace-nav-link" type="button" data-workspace="settings" title="Settings"><span class="workspace-nav-icon" aria-hidden="true">⚙</span><span>Settings</span></button>
          <button class="workspace-nav-link" id="workspaceUsersLink" type="button" data-workspace="users" title="User management" hidden><span class="workspace-nav-icon" aria-hidden="true">♙</span><span>User Management</span></button>
        </nav>
        <div class="workspace-sidebar-footer">
          <button class="workspace-nav-link" type="button" data-workspace="about" data-about-section="about" title="About Beabots"><span class="workspace-nav-icon" aria-hidden="true">ⓘ</span><span>About Beabots</span></button>
          <button class="workspace-nav-link" type="button" data-workspace="about" data-about-section="contact" title="Contact"><span class="workspace-nav-icon" aria-hidden="true">✉</span><span>Contact</span></button>
        </div>
      </aside>
      <button class="workspace-backdrop" id="workspaceBackdrop" type="button" aria-label="Close workspace menu" hidden></button>

      <div class="workspace-main">
        <header class="workspace-header">
          <button class="workspace-mobile-toggle" id="workspaceMobileToggle" type="button" aria-label="Open workspace menu" aria-controls="workspaceSidebar" aria-expanded="false"><span aria-hidden="true">☰</span></button>
      <div class="workspace-header-spacer"></div>
      <div class="workspace-notifications">
        <button class="workspace-notification-trigger" id="workspaceNotificationTrigger" type="button" aria-expanded="false" aria-label="Notifications"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M10 21a2 2 0 0 0 4 0"/></svg><span id="workspaceUnreadBadge" hidden></span></button>
        <div class="workspace-notification-menu" id="workspaceNotificationMenu" hidden><strong>Messages</strong><button id="workspaceNotificationChat" type="button"><span>Team Chat</span><span class="workspace-chat-unread" id="workspaceChatUnread" hidden></span></button></div>
      </div>
      <div class="workspace-account">
        <button class="workspace-account-trigger" id="workspaceAccountTrigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="workspaceAccountMenu">
          <span class="workspace-avatar" id="workspaceUserAvatar"><img src="assets/avatar/avatar-penguin.svg" alt=""></span><span class="workspace-account-name" id="workspaceUserName">Workspace</span><span class="workspace-account-chevron" aria-hidden="true">⌄</span>
        </button>
        <div class="workspace-account-menu" id="workspaceAccountMenu" role="menu" hidden>
          <button id="workspaceProfileSettings" type="button" role="menuitem">Profile Settings</button>
          <button id="workspaceSignOut" type="button" role="menuitem">Sign out</button>
        </div>
      </div>
    </header>

        <main class="workspace-content" id="workspaceContent" aria-label="Workspace content">
        <h1 class="visually-hidden" id="workspacePageTitle">Dashboard</h1>
        <iframe class="workspace-frame active" data-workspace-frame="dashboard" src="dashboard-home.html" title="Dashboard"></iframe>
        <iframe class="workspace-frame" data-workspace-frame="soaExcel" title="SOA Generator"></iframe>
        <iframe class="workspace-frame" data-workspace-frame="cf2" title="Claim Form 2"></iframe>
        <iframe class="workspace-frame" data-workspace-frame="uploadSoa" title="Upload SOA"></iframe>
        <iframe class="workspace-frame" data-workspace-frame="cf4" title="Claim Form 4"></iframe>
        <iframe class="workspace-frame" data-workspace-frame="uploadDocuments" title="Upload Documents"></iframe>
        <iframe class="workspace-frame" data-workspace-frame="editClaims" title="Edit Claims"></iframe>
        <iframe class="workspace-frame" data-workspace-frame="runAll" title="Run Full Workflow"></iframe>
        <iframe class="workspace-frame" data-workspace-frame="autoRename" title="PDF Auto Rename"></iframe>
        <iframe class="workspace-frame" data-workspace-frame="teamCollab" title="Team Chat"></iframe>
        <iframe class="workspace-frame" data-workspace-frame="settings" title="Settings"></iframe>
        <iframe class="workspace-frame" data-workspace-frame="users" title="User Management"></iframe>
        <iframe class="workspace-frame" data-workspace-frame="about" title="About Beabots"></iframe>
        </main>
      </div>
    </div>
  </div>
  <script src="js/common.js"></script>
  <script src="js/workspace.js"></script>
</body>
</html>
