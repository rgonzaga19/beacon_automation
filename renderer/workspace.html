<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1424">
  <title>Beabots | Workspace</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/workspace.css">
</head>
<body class="workspace-page">
  <div class="workspace-shell" id="workspaceShell">


    <div class="workspace-body">
      <aside class="workspace-sidebar" id="workspaceSidebar" aria-label="Workspace navigation">
        <div class="workspace-sidebar-brand"><a class="workspace-brand" href="/workspace.html" aria-label="Beabots dashboard"><img src="assets/bot.ico" alt=""><span><strong>BEABOTS</strong><small>BEACON AUTOMATION</small></span></a></div>
        <div class="workspace-sidebar-top"><span>WORKSPACE</span><button id="workspaceSidebarCollapse" type="button" aria-label="Collapse sidebar" aria-expanded="true" title="Collapse sidebar"><i class="workspace-sidebar-collapse-icon" data-lucide="chevron-left" data-icon-size="16" aria-hidden="true"></i></button></div>
        <nav class="workspace-nav">
          <button class="workspace-nav-link" type="button" data-workspace="dashboard" title="Dashboard"><i class="workspace-nav-icon" data-lucide="house" data-icon-size="20" aria-hidden="true"></i><span>Dashboard</span></button>
          <section class="workspace-nav-group">
            <button class="workspace-nav-link workspace-group-trigger" type="button" data-nav-group="soa" data-collapsed-workspace="soaExcel" data-collapsed-soa-tab="individual" aria-expanded="false" aria-controls="workspaceSoaSubnav" title="SOA Generator"><i class="workspace-nav-icon" data-lucide="file-spreadsheet" data-icon-size="20" aria-hidden="true"></i><span>SOA Generator</span><i class="workspace-group-chevron" data-lucide="plus" data-icon-size="16" aria-hidden="true"></i></button>
            <div class="workspace-subnav" id="workspaceSoaSubnav" hidden>
              <button class="workspace-nav-link" type="button" data-workspace="soaExcel" data-soa-tab="individual"><i class="workspace-nav-icon" data-lucide="user-round" data-icon-size="20" aria-hidden="true"></i><span>Individual</span></button>
              <button class="workspace-nav-link" type="button" data-workspace="soaExcel" data-soa-tab="batch"><i class="workspace-nav-icon" data-lucide="layers" data-icon-size="20" aria-hidden="true"></i><span>Batch Generate</span></button>
            </div>
          </section>
          <section class="workspace-nav-group">
            <button class="workspace-nav-link workspace-group-trigger" type="button" data-nav-group="automation" data-collapsed-workspace="cf2" aria-expanded="false" aria-controls="workspaceAutomationSubnav" title="Automation"><i class="workspace-nav-icon" data-lucide="workflow" data-icon-size="20" aria-hidden="true"></i><span>Automation</span><i class="workspace-group-chevron" data-lucide="plus" data-icon-size="16" aria-hidden="true"></i></button>
            <div class="workspace-subnav" id="workspaceAutomationSubnav" hidden>
              <button class="workspace-nav-link" type="button" data-workspace="cf2"><i class="workspace-nav-icon" data-lucide="file-text" data-icon-size="20" aria-hidden="true"></i><span>Claim Form 2</span></button>
              <button class="workspace-nav-link" type="button" data-workspace="uploadSoa"><i class="workspace-nav-icon" data-lucide="upload" data-icon-size="20" aria-hidden="true"></i><span>Upload SOA</span></button>
              <button class="workspace-nav-link" type="button" data-workspace="cf4"><i class="workspace-nav-icon" data-lucide="file-check-2" data-icon-size="20" aria-hidden="true"></i><span>Claim Form 4</span></button>
              <button class="workspace-nav-link" type="button" data-workspace="uploadDocuments"><i class="workspace-nav-icon" data-lucide="files" data-icon-size="20" aria-hidden="true"></i><span>Upload Documents</span></button>
            </div>
          </section>
          <button class="workspace-nav-link" type="button" data-workspace="editClaims" title="Edit claims"><i class="workspace-nav-icon" data-lucide="file-pen-line" data-icon-size="20" aria-hidden="true"></i><span>Edit Claims</span></button>
          <button class="workspace-nav-link" type="button" data-workspace="runAll" title="Run full workflow"><i class="workspace-nav-icon" data-lucide="play" data-icon-size="20" aria-hidden="true"></i><span>Run Full Workflow</span></button>
          <section class="workspace-nav-group">
            <button class="workspace-nav-link workspace-group-trigger" type="button" data-nav-group="tools" data-collapsed-workspace="autoRename" aria-expanded="false" aria-controls="workspaceToolsSubnav" title="Other tools"><i class="workspace-nav-icon" data-lucide="wrench" data-icon-size="20" aria-hidden="true"></i><span>Other Tools</span><i class="workspace-group-chevron" data-lucide="plus" data-icon-size="16" aria-hidden="true"></i></button>
            <div class="workspace-subnav" id="workspaceToolsSubnav" hidden>
              <button class="workspace-nav-link" type="button" data-workspace="autoRename"><i class="workspace-nav-icon" data-lucide="file-text" data-icon-size="20" aria-hidden="true"></i><span>PDF Auto Rename</span></button>
              <a class="workspace-nav-link external-link" href="https://rgonzaga19.github.io/pdfsplitter/" target="_blank" rel="noopener noreferrer"><i class="workspace-nav-icon" data-lucide="scissors" data-icon-size="20" aria-hidden="true"></i><span>PDF Splitter</span><i class="workspace-external-icon" data-lucide="arrow-up-right" data-icon-size="16" aria-hidden="true"></i></a>
              <a class="workspace-nav-link external-link" href="https://rgonzaga19.github.io/pdfeditor/" target="_blank" rel="noopener noreferrer"><i class="workspace-nav-icon" data-lucide="file-pen-line" data-icon-size="20" aria-hidden="true"></i><span>PDF Editor</span><i class="workspace-external-icon" data-lucide="arrow-up-right" data-icon-size="16" aria-hidden="true"></i></a>
              <a class="workspace-nav-link external-link" href="https://rgonzaga19.github.io/nephro_dtrgenerator/" target="_blank" rel="noopener noreferrer"><i class="workspace-nav-icon" data-lucide="calendar-days" data-icon-size="20" aria-hidden="true"></i><span>DTR Generator</span><i class="workspace-external-icon" data-lucide="arrow-up-right" data-icon-size="16" aria-hidden="true"></i></a>
            </div>
          </section>
          <button class="workspace-nav-link" type="button" data-workspace="teamCollab" title="Team chat"><i class="workspace-nav-icon" data-lucide="messages-square" data-icon-size="20" aria-hidden="true"></i><span>Team Chat</span></button>
          <button class="workspace-nav-link" type="button" data-workspace="settings" title="Settings"><i class="workspace-nav-icon" data-lucide="settings" data-icon-size="20" aria-hidden="true"></i><span>Settings</span></button>
        </nav>
        <div class="workspace-sidebar-footer">
          <button class="workspace-nav-link" type="button" data-workspace="about" data-about-section="about" title="About Beabots"><i class="workspace-nav-icon" data-lucide="info" data-icon-size="20" aria-hidden="true"></i><span>About Beabots</span></button>
          <button class="workspace-nav-link" type="button" data-workspace="about" data-about-section="contact" title="Contact"><i class="workspace-nav-icon" data-lucide="mail" data-icon-size="20" aria-hidden="true"></i><span>Contact</span></button>
        </div>
      </aside>
      <button class="workspace-backdrop" id="workspaceBackdrop" type="button" aria-label="Close workspace menu" hidden></button>

      <div class="workspace-main">
        <header class="workspace-header">
          <button class="workspace-mobile-toggle" id="workspaceMobileToggle" type="button" aria-label="Open workspace menu" aria-controls="workspaceSidebar" aria-expanded="false"><i class="workspace-header-icon workspace-mobile-icon" data-lucide="menu" data-icon-size="16" aria-hidden="true"></i></button>
          <div class="workspace-beacon-status" id="workspaceBeaconStatus" role="img" aria-label="Checking Beacon connection" title="Checking Beacon connection">
            <svg class="workspace-heartbeat heartbeat-disconnected" id="workspaceBeaconHeartbeat" viewBox="0 0 100 24" aria-hidden="true"><path d="M2 13h96"></path><path class="heartbeat-flat-base" d="M2 13h96"></path><path class="heartbeat-flat-trace" d="M2 13h96"></path></svg>
          </div>
          <form class="workspace-search" id="workspaceSearchForm" role="search">
            <i class="workspace-header-icon" data-lucide="search" data-icon-size="16" aria-hidden="true"></i>
            <input id="workspaceSearchInput" type="search" list="workspaceSearchOptions" placeholder="Search tools, patients, or transmittal #" aria-label="Search tools, patients, or transmittal number" autocomplete="off">
            <datalist id="workspaceSearchOptions"><option value="Dashboard"></option><option value="SOA Generator"></option><option value="Claim Form 2"></option><option value="Upload SOA"></option><option value="Claim Form 4"></option><option value="Upload Documents"></option><option value="Edit Claims"></option><option value="Run Full Workflow"></option><option value="PDF Auto Rename"></option><option value="PDF Splitter"></option><option value="PDF Editor"></option><option value="DTR Generator"></option><option value="Team Chat"></option><option value="Settings"></option></datalist>
            <kbd aria-label="Enter"><i class="workspace-header-icon" data-lucide="corner-down-left" data-icon-size="16" aria-hidden="true"></i></kbd>
          </form>
          <div class="workspace-header-spacer"></div>
          <button class="workspace-notification-trigger" id="workspaceUsersLink" type="button" aria-label="User Management" title="User Management" hidden><i class="workspace-header-icon" data-lucide="users-round" data-icon-size="16" aria-hidden="true"></i></button>
          <div class="workspace-notifications">
        <button class="workspace-notification-trigger" id="workspaceNotificationTrigger" type="button" aria-expanded="false" aria-label="Notifications"><i class="workspace-header-icon" data-lucide="bell" data-icon-size="16" aria-hidden="true"></i><span id="workspaceUnreadBadge" hidden></span></button>
        <div class="workspace-notification-menu" id="workspaceNotificationMenu" hidden><strong>Messages</strong><button id="workspaceNotificationChat" type="button"><i class="workspace-menu-icon" data-lucide="messages-square" data-icon-size="16" aria-hidden="true"></i><span>Team Chat</span><span class="workspace-chat-unread" id="workspaceChatUnread" hidden></span></button></div>
      </div>
          <button class="workspace-notification-trigger" id="workspaceThemeToggle" type="button" role="switch" aria-checked="false" aria-label="Light mode" title="Switch to light mode"><i class="workspace-theme-icon" data-lucide="toggle-left" data-icon-size="20" aria-hidden="true"></i></button>
      <div class="workspace-account">
        <button class="workspace-account-trigger" id="workspaceAccountTrigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="workspaceAccountMenu">
          <span class="workspace-avatar" id="workspaceUserAvatar"><img src="assets/avatar/avatar-penguin.svg" alt=""></span><span class="workspace-account-name" id="workspaceUserName">Workspace</span><i class="workspace-account-chevron" data-lucide="chevron-down" data-icon-size="16" aria-hidden="true"></i>
        </button>
        <div class="workspace-account-menu" id="workspaceAccountMenu" role="menu" hidden>
          <button id="workspaceProfileSettings" type="button" role="menuitem"><i class="workspace-menu-icon" data-lucide="user-round" data-icon-size="16" aria-hidden="true"></i>Profile Settings</button>
          <button id="workspaceSignOut" type="button" role="menuitem"><i class="workspace-menu-icon" data-lucide="log-out" data-icon-size="16" aria-hidden="true"></i>Sign out</button>
        </div>
      </div>
    </header>

        <main class="workspace-content" id="workspaceContent" aria-label="Workspace content">
        <h1 class="visually-hidden" id="workspacePageTitle">Dashboard</h1>
        <iframe class="workspace-frame active" data-workspace-frame="dashboard" src="dashboard-home.html" title="Dashboard"></iframe>
        <iframe class="workspace-frame" data-workspace-frame="soaExcel" title="SOA Generator"></iframe>
        <iframe class="workspace-frame" data-workspace-frame="cf2" title="Claim Form 2"></iframe>
        <iframe class="workspace-frame" data-workspace-frame="uploadSoa" title="Upload SOA"></iframe>
        <iframe class="workspace-frame" data-workspace-frame="cf4" title="Claim Form 4"></iframe>
        <iframe class="workspace-frame" data-workspace-frame="uploadDocuments" title="Upload Documents"></iframe>
        <iframe class="workspace-frame" data-workspace-frame="editClaims" title="Edit Claims"></iframe>
        <iframe class="workspace-frame" data-workspace-frame="runAll" title="Run Full Workflow"></iframe>
        <iframe class="workspace-frame" data-workspace-frame="autoRename" title="PDF Auto Rename"></iframe>
        <iframe class="workspace-frame" data-workspace-frame="teamCollab" title="Team Chat"></iframe>
        <iframe class="workspace-frame" data-workspace-frame="settings" title="Settings"></iframe>
        <iframe class="workspace-frame" data-workspace-frame="users" title="User Management"></iframe>
        <iframe class="workspace-frame" data-workspace-frame="about" title="About Beabots"></iframe>
        </main>
      </div>
    </div>
  </div>
  <script src="js/common.js"></script>
  <script src="vendor/lucide/lucide.min.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/workspace.js"></script>
</body>
</html>
