<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1424">
  <title>Lucide Icon Preview | Beabots</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/theme.css">
  <style>
    * { box-sizing:border-box; }
    body { min-width:320px; min-height:100vh; margin:0; color:var(--text-pri); background:var(--bg-dark); font:13px var(--font-ui); }
    .preview-shell { width:min(1180px,calc(100% - 40px)); margin:0 auto; padding:30px 0 56px; }
    .preview-topbar { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:38px; }
    .preview-brand { display:flex; align-items:center; gap:10px; color:var(--text-pri); text-decoration:none; }
    .preview-brand img { width:32px; height:32px; }
    .preview-brand strong,.preview-brand small { display:block; }
    .preview-brand strong { font-size:12px; letter-spacing:1px; }
    .preview-brand small { margin-top:3px; color:var(--text-sec); font-size:8px; letter-spacing:.8px; }
    .preview-actions { display:flex; align-items:center; gap:10px; }
    .preview-link,.preview-toggle { display:inline-flex; min-height:38px; align-items:center; justify-content:center; gap:8px; padding:0 13px; color:var(--text-pri); background:var(--bg-panel); border:1px solid var(--border); border-radius:9px; font:650 11px var(--font-ui); text-decoration:none; cursor:pointer; }
    .preview-link:hover,.preview-toggle:hover { color:var(--accent); border-color:var(--accent); }
    .preview-link svg,.preview-toggle svg { width:16px; height:16px; }
    .preview-heading { display:flex; align-items:end; justify-content:space-between; gap:22px; margin-bottom:24px; }
    .preview-eyebrow { color:var(--accent); font-size:9px; font-weight:800; letter-spacing:1.3px; text-transform:uppercase; }
    h1 { margin:8px 0 8px; font-size:clamp(26px,4vw,38px); letter-spacing:-1px; }
    .preview-heading p { max-width:620px; margin:0; color:var(--text-sec); line-height:1.65; }
    .preview-controls { display:flex; align-items:center; gap:10px; margin-bottom:20px; }
    .preview-controls input { width:min(340px,100%); height:40px; padding:0 13px; color:var(--text-pri); background:var(--bg-panel); border:1px solid var(--border); border-radius:10px; font:500 12px var(--font-ui); }
    .preview-controls input:focus { border-color:var(--accent); outline:3px solid var(--accent-soft); }
    .preview-count { color:var(--text-sec); font-size:10px; }
    .preview-section { margin:25px 0 0; }
    .preview-section h2 { margin:0 0 11px; color:var(--text-sec); font-size:10px; letter-spacing:1px; text-transform:uppercase; }
    .icon-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(188px,1fr)); gap:10px; }
    .icon-card { min-width:0; padding:14px; background:var(--bg-panel); border:1px solid var(--border); border-radius:12px; transition:border-color .16s ease,transform .16s ease; }
    .icon-card:hover { border-color:color-mix(in srgb,var(--accent) 62%,var(--border)); transform:translateY(-2px); }
    .icon-card[hidden] { display:none; }
    .icon-card-head { display:flex; align-items:center; gap:10px; }
    .icon-preview { display:grid; width:38px; height:38px; flex:none; place-items:center; color:var(--accent); background:var(--accent-soft); border:1px solid color-mix(in srgb,var(--accent) 20%,transparent); border-radius:10px; }
    .icon-preview svg { width:20px; height:20px; }
    .icon-title { min-width:0; }
    .icon-title strong { display:block; overflow:hidden; font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
    .icon-title small { display:block; margin-top:4px; color:var(--text-sec); font-size:9px; }
    .icon-sizes { display:flex; justify-content:space-between; gap:8px; margin-top:13px; padding-top:10px; border-top:1px solid var(--border); }
    .size-sample { display:flex; align-items:center; gap:6px; color:var(--text-sec); font-size:9px; }
    .size-sample svg { color:var(--accent); }
    .empty-state { padding:28px; color:var(--text-sec); background:var(--bg-panel); border:1px dashed var(--border); border-radius:12px; text-align:center; }
    @media(max-width:620px) { .preview-shell { width:min(100% - 26px,1180px); padding-top:18px; } .preview-topbar { margin-bottom:27px; } .preview-heading { align-items:flex-start; flex-direction:column; } .icon-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; } .icon-card { padding:10px; } .icon-sizes { flex-direction:column; } .preview-link { padding:0 10px; } }
    @media(max-width:380px) { .preview-grid { grid-template-columns:1fr; } .preview-brand small { display:none; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; } }
  </style>
  <script src="vendor/lucide/lucide.min.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/icon-preview.js" defer></script>
</head>
<body>
  <main class="preview-shell">
    <div class="preview-topbar">
      <a class="preview-brand" href="/workspace.html"><img src="assets/bot.ico" alt=""><span><strong>BEABOTS</strong><small>BEACON AUTOMATION</small></span></a>
      <div class="preview-actions">
        <button class="preview-toggle" id="previewThemeToggle" type="button" aria-label="Switch color theme"></button>
        <a class="preview-link" href="/workspace.html"><span id="backIcon"></span>Workspace</a>
      </div>
    </div>
    <header class="preview-heading">
      <div><span class="preview-eyebrow">Icon system proposal</span><h1>Lucide icon preview</h1><p>Review a consistent outline icon set against Beabots dark navy and turquoise colors and the light theme. Existing application icons have not been changed.</p></div>
    </header>
    <div class="preview-controls">
      <input id="iconFilter" type="search" placeholder="Filter icons by name or use" aria-label="Filter icon previews">
      <span class="preview-count" id="iconCount" aria-live="polite"></span>
    </div>
    <div id="iconPreviewGroups"></div>
    <p class="empty-state" id="iconEmptyState" hidden>No icons match that filter.</p>
  </main>
</body>
</html>
